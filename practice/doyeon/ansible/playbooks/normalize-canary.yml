---
- name: Restore equal upstream weights after all backends run the new release
  hosts: load_balancers
  become: true
  gather_facts: false
  tasks:
    - name: Require all weighted backends to be active
      ansible.builtin.command:
        argv: [grep, -Fxc, "    server {{ hostvars[item].ansible_host }}:{{ app_port }} weight={{ canary_weight if item == canary_host else stable_weight }};", "{{ nginx_config }}"]
      loop: "{{ groups['app_servers'] }}"
      register: weighted_line
      changed_when: false
      failed_when: weighted_line.rc != 0 or weighted_line.stdout != '1'

    - name: Restore normal upstream lines
      ansible.builtin.lineinfile:
        path: "{{ nginx_config }}"
        regexp: "^    server {{ hostvars[item].ansible_host | regex_escape }}:{{ app_port }} weight=[0-9]+;$"
        line: "    server {{ hostvars[item].ansible_host }}:{{ app_port }};"
        backrefs: true
      loop: "{{ groups['app_servers'] }}"

    - name: Validate the normal upstream
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Reload Nginx with equal weights
      ansible.builtin.service:
        name: nginx
        state: reloaded
