---
- name: Identify the last healthy release on every backend
  hosts: app_servers
  become: false
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Check health and read release metadata
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        status_code: 200
        timeout: 5
      register: current_health
      failed_when: >-
        current_health.status != 200 or current_health.json.status != 'ok' or
        current_health.json.instance != inventory_hostname

- name: Save the shared healthy release for Jenkins
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    first_backend: "{{ groups['app_servers'] | sort | first }}"
    previous_version: "{{ hostvars[first_backend].current_health.json.version }}"
    previous_release: "{{ hostvars[first_backend].current_health.json.release }}"
  tasks:
    - name: Require all backends to serve the same release
      ansible.builtin.assert:
        that:
          - hostvars[item].current_health.json.version == previous_version
          - hostvars[item].current_health.json.release == previous_release
      loop: "{{ groups['app_servers'] }}"

    - name: Require safe release identifiers
      ansible.builtin.assert:
        that:
          - previous_version is match('^[A-Za-z0-9][A-Za-z0-9_.-]{0,31}$')
          - previous_release is match('^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$')

    - name: Save the rollback target in the Jenkins workspace
      ansible.builtin.copy:
        dest: "{{ snapshot_path }}"
        content: "{{ previous_version }}\n{{ previous_release }}\n"
        mode: '0600'
