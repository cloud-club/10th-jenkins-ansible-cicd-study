---
# 색 하나 = 컨테이너 하나 = 포트 하나.
# 1주차는 blue만 쓰지만 2주차에 green을 추가할 때 이 Role을 그대로 재사용한다.
app_color: blue
app_port: "{{ app_ports[app_color] }}"
app_container: "{{ owner }}-app-{{ app_color }}"
app_stage_dir: "/opt/{{ owner }}/images"
# 파이프라인이 로드한 이미지 ID 기록 (태그별 파일). 무결성 게이트의 기준값
app_id_dir: "/opt/{{ owner }}/image-ids"
