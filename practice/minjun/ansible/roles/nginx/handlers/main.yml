---
# 1주차 적용 스크립트를 handler로 옮겼다. 락 안에서: 백업 → 교체 → nginx -t → reload. 실패 시 원복.
#
# delegate_to를 handler에 직접 적는다. notify한 태스크가 LB로 delegate돼 있어도
# handler는 notify한 호스트(app1 등)에서 실행된다 (로컬 검증).

- name: apply nginx conf
  ansible.builtin.shell: |
    set -u
    NEW="{{ nginx_stage }}"
    CUR="{{ nginx_conf }}"
    BAK="{{ nginx_stage | dirname }}/{{ owner }}.conf.bak"
    exec 9>"{{ nginx_lock }}"
    flock -w 60 9 || { echo "LOCK_TIMEOUT"; exit 1; }

    if [ -f "$CUR" ] && cmp -s "$NEW" "$CUR"; then
      echo "UNCHANGED"; exit 0
    fi

    if [ -f "$CUR" ]; then cp -p "$CUR" "$BAK"; else rm -f "$BAK"; fi
    cp "$NEW" "$CUR"

    if ! nginx -t 2>&1; then
      if [ -f "$BAK" ]; then cp -p "$BAK" "$CUR"; else rm -f "$CUR"; fi
      echo "NGINX_TEST_FAILED (my change reverted)"; exit 1
    fi

    # 실제로 적용된 파일에서 down인 서버 이름을 읽어 출력한다 (태스크 이름이 아니라 결과로 확인)
    DOWN="$(grep ' down ' "$CUR" | sed 's/.*# *//' | paste -sd, -)"
    systemctl reload nginx && echo "NGINX_RELOADED down=[${DOWN}]"
  args:
    executable: /bin/bash
  register: nginx_apply
  changed_when: "'NGINX_RELOADED' in nginx_apply.stdout"
  delegate_to: "{{ nginx_lb_host }}"
  listen: apply nginx conf

- name: show nginx apply result
  ansible.builtin.debug:
    msg: "{{ nginx_apply.stdout_lines | last }}"
  listen: apply nginx conf
