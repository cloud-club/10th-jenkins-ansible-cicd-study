---
# 2주차: Rolling 배포
#
# app1 → app2 → app3 한 대씩:
#   drain(Nginx에서 down + reload) → 대기 → 컨테이너 교체 → 서버 직접 헬스체크
#   → undrain(down 해제 + reload) → Nginx 경유로 다시 응답하는지 확인
#
# 실패하면 그 서버는 drain된 채로 남고(fail-safe), max_fail_percentage: 0 이라 다음 서버로 넘어가지 않는다.
#
# 변수
#   rolling_drain: true  → 방식 A (drain 후 교체, 기본)
#                  false → 방식 C (drain 없이 교체, Nginx 재시도에 맡김 — 비교 실험용)
#   drain_wait:    drain 후 진행 중 요청이 끝나길 기다리는 초

# ---------------------------------------------------------------------------
# [0] 사전 확인
#   - 서비스 중인 서버가 아프면 시작하지 않는다 (한 대를 더 빼면 1대만 남는다)
#   - 이전 배포의 fail-safe로 이미 down된 고장 서버는 허용한다 (3주차 롤백이 여기 막히지 않게)
#     → 그 서버는 drain 목록에 계속 고정(pinned)하고, 가장 먼저 교체한다
- name: Pre-flight — health and current drain state
  hosts: lb
  gather_facts: false
  tasks:
    - name: Read live nginx conf
      ansible.builtin.slurp:
        src: "/etc/nginx/conf.d/{{ owner }}.conf"
      register: live_conf
      failed_when: false

    # 템플릿이 server 줄 끝에 "# app1" 주석을 달아 둔다 → down인 서버 이름을 뽑는다
    - name: Servers already marked down
      ansible.builtin.set_fact:
        already_down: >-
          {{ (live_conf.content | default('') | b64decode)
             | regex_findall(' down [^#]*# *([A-Za-z0-9_.-]+)') }}

    - name: LB → each app server /health
      ansible.builtin.uri:
        url: "http://{{ hostvars[item].ansible_host }}:{{ app_ports[active_color] }}/health"
        status_code: 200
        timeout: 3
      loop: "{{ groups['app'] }}"
      register: hc
      failed_when: false

    - name: Classify
      ansible.builtin.set_fact:
        unhealthy: "{{ hc.results | rejectattr('status', 'equalto', 200) | map(attribute='item') | list }}"

    - name: Only already-drained servers may be unhealthy (max 1)
      ansible.builtin.assert:
        that:
          - unhealthy | difference(already_down) | length == 0
          - unhealthy | length <= 1
        fail_msg: >-
          unhealthy={{ unhealthy }} already_down={{ already_down }}.
          A server in service is failing — not starting a rolling deploy.
        success_msg: "unhealthy={{ unhealthy }} (pinned down, repaired first) already_down={{ already_down }}"

    # pinned_down: 교체가 끝날 때까지 down을 유지할 서버. 서버를 고칠 때마다 줄어든다.
    - name: Remember pinned servers
      ansible.builtin.set_fact:
        pinned_down: "{{ unhealthy }}"

    - name: Repair broken servers first
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: repair_first
      loop: "{{ unhealthy }}"

    - name: Audit DEPLOY_START
      ansible.builtin.include_tasks: tasks/audit.yml
      vars:
        audit_event: DEPLOY_START
        audit_extra:
          drain: "{{ rolling_drain | default(true) | bool }}"
          already_down: "{{ already_down }}"
          unhealthy: "{{ unhealthy }}"

# ---------------------------------------------------------------------------
# [1~3] 한 대씩 교체
#   태스크 이름에 {{ inventory_hostname }}을 넣지 않는다. serial로 나뉜 배치에서도 이름은 첫 서버 기준으로
#   한 번만 해석돼서 app2 차례에 "app1"로 찍힌다 (2주차 빌드 로그에서 확인). 서버는 로그의 [app2]로 본다.
- name: Rolling deploy (one server at a time)
  hosts: "repair_first:app"     # 고장 서버가 있으면 그 서버부터, 나머지는 인벤토리 순서
  become: true
  gather_facts: false
  serial: 1
  max_fail_percentage: 0
  vars:
    rolling_drain: true
    drain_wait: 3
    app_container: "{{ owner }}-app-{{ active_color }}"
    target_image: "{{ app_image }}:{{ image_tag }}"
    lb_host: "{{ groups['lb'][0] }}"
    # 매 서버마다 lb1에서 다시 읽는다 (앞 서버를 고치면 목록에서 빠짐)
    pinned: "{{ hostvars[lb_host].pinned_down | default([]) }}"
    is_pinned: "{{ inventory_hostname in pinned }}"

  pre_tasks:
    # 같은 버전 재배포면 drain/reload를 하지 않는다 (1주차 멱등성 유지).
    - name: Inspect current container
      community.docker.docker_container_info:
        name: "{{ app_container }}"
      register: cur

    - name: Decide whether this server needs an update
      ansible.builtin.set_fact:
        current_image: "{{ cur.container.Config.Image if cur.exists else 'none' }}"
        needs_update: >-
          {{ (not cur.exists) or (cur.container.Config.Image != target_image) or (is_pinned | bool) }}

    - name: Plan
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}: {{ current_image }} → {{ target_image }}
          | update={{ needs_update }} drain={{ rolling_drain | bool }} pinned={{ pinned }}

    # --- drain ---------------------------------------------------------------
    - name: Drain this server from nginx
      ansible.builtin.import_role:
        name: nginx
        tasks_from: render
      vars:
        # 고장 서버의 down은 유지한 채 이 서버를 추가로 뺀다
        drained_hosts: "{{ (pinned + [inventory_hostname]) | unique }}"
      when: needs_update and (rolling_drain | bool)

    - name: Apply drain now
      ansible.builtin.meta: flush_handlers

    - name: Wait for in-flight requests
      ansible.builtin.pause:
        seconds: "{{ drain_wait }}"
      when: needs_update and (rolling_drain | bool)

    # drain이 실제로 먹혔는지: Nginx 경유 요청에 이 서버가 한 번도 안 나와야 한다.
    - name: Confirm drained server gets no traffic
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ lb_port }}/version"
        return_content: true
        timeout: 3
      register: drained_probe
      loop: "{{ range(6) | list }}"
      loop_control:
        label: "probe {{ item }}"
      failed_when: drained_probe.json.host == inventory_hostname
      delegate_to: "{{ lb_host }}"
      become: false
      when: needs_update and (rolling_drain | bool)

    - name: Audit SERVER_DRAINED
      ansible.builtin.include_tasks: tasks/audit.yml
      vars:
        audit_event: SERVER_DRAINED
      when: needs_update and (rolling_drain | bool)

  # --- 교체 + 서버 직접 헬스체크 (1주차 Role 그대로) ---------------------------
  # 이미지 로드 → 컨테이너 교체 → 127.0.0.1:20006 /health 200 → /version == 새 버전
  roles:
    - role: app
      vars:
        app_color: "{{ active_color }}"

  post_tasks:
    # --- undrain -------------------------------------------------------------
    - name: Undrain this server
      ansible.builtin.import_role:
        name: nginx
        tasks_from: render
      vars:
        drained_hosts: "{{ pinned | difference([inventory_hostname]) }}"
      # no-drain 모드라도 고장으로 빠져 있던 서버는 고쳤으면 다시 넣어야 한다
      when: needs_update and ((rolling_drain | bool) or (is_pinned | bool))

    - name: Apply undrain now
      ansible.builtin.meta: flush_handlers

    - name: Repaired server → unpin
      ansible.builtin.set_fact:
        pinned_down: "{{ pinned | difference([inventory_hostname]) }}"
      delegate_to: "{{ lb_host }}"
      delegate_facts: true
      when: is_pinned | bool

    # Nginx를 거쳐 이 서버가 새 버전으로 다시 응답하는지 (라운드로빈이라 몇 번 걸릴 수 있다)
    - name: Server answers through nginx with new version
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ lb_port }}/version"
        return_content: true
        timeout: 3
      register: back_probe
      until: >-
        back_probe.json is defined
        and back_probe.json.host == inventory_hostname
        and back_probe.json.version == app_version
      retries: 12
      delay: 1
      delegate_to: "{{ lb_host }}"
      become: false
      when: needs_update

    - name: Audit SERVER_UPDATED
      ansible.builtin.include_tasks: tasks/audit.yml
      vars:
        audit_event: SERVER_UPDATED
        audit_extra:
          from: "{{ current_image }}"
          drain: "{{ rolling_drain | bool }}"
      when: needs_update

# ---------------------------------------------------------------------------
# [4] 전부 성공했을 때만 도달한다 → 3주차 롤백용 "마지막 정상 태그" 기록
#     이전 값은 prev_good_tag로 밀어 둔다. 이미지는 서버에서 지우지 않는다.
- name: Record last good tag
  hosts: app
  become: true
  gather_facts: false
  tasks:
    - name: last_good_tag ← {{ image_tag }}
      ansible.builtin.shell: |
        set -eu
        D="/opt/{{ owner }}"; TAG="{{ image_tag }}"
        mkdir -p "$D"
        CUR="$(cat "$D/last_good_tag" 2>/dev/null || true)"
        if [ "$CUR" = "$TAG" ]; then echo "UNCHANGED"; exit 0; fi
        [ -n "$CUR" ] && echo "$CUR" > "$D/prev_good_tag"
        echo "$TAG" > "$D/last_good_tag"
        echo "UPDATED prev=${CUR:-none} last=$TAG"
      args:
        executable: /bin/bash
      register: tag_rec
      changed_when: "'UPDATED' in tag_rec.stdout"

    - name: Audit DEPLOY_DONE
      ansible.builtin.include_tasks: tasks/audit.yml
      vars:
        audit_event: DEPLOY_DONE
      run_once: true
