---
- name: Remove the previous run's deployment record
  ansible.builtin.file:
    path: "{{ playbook_dir }}/../../.artifacts/deployment-result.json"
    state: absent
  delegate_to: localhost
  become: false

- name: Validate deployment topology and release metadata once
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - groups['load_balancers'] | length == 1
      - groups['app_servers'] | length == 3
      - member == 'dongwook'
      - container_name == 'dongwook-app'
      - slot_ports == {'blue':20003, 'green':21003}
      - app_version | default('') | length > 0
      - release_id | default('') | length > 0
      - git_revision | default('') | length > 0
      - image_repository | default('') is match('^[a-z0-9][a-z0-9_-]*/dongwook-app$')
      - image_ref | default('') is match('^' ~ (image_repository | regex_escape) ~ '@sha256:[0-9a-f]{64}$')
    fail_msg: Check the complete inventory and digest-based release metadata before deployment.

- name: Check registry credentials before contacting app servers
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'DOCKERHUB_USERNAME') | length > 0
      - lookup('ansible.builtin.env', 'DOCKERHUB_TOKEN') | length > 0
  no_log: true

- name: Read the existing configuration for discovery and rollback
  ansible.builtin.slurp:
    src: "{{ nginx_config_path }}"
  register: previous_nginx_config

- name: Determine slots from the three upstream addresses
  ansible.builtin.command:
    argv: "{{ ['python3', playbook_dir ~ '/../../scripts/deployment_state.py', '--upstream', nginx_upstream, '--hosts'] + (groups['app_servers'] | map('extract', hostvars, 'ansible_host') | list) }}"
    stdin: "{{ previous_nginx_config.content | b64decode }}"
  delegate_to: localhost
  become: false
  register: discovered_slots
  changed_when: false

- name: Remember the active and candidate slots for this deployment
  ansible.builtin.set_fact:
    active_slot: "{{ (discovered_slots.stdout | from_json).active_slot }}"
    target_slot: "{{ (discovered_slots.stdout | from_json).target_slot }}"

- name: Check the active service and capture its release
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nginx_port }}/health"
    use_proxy: false
    return_content: true
    timeout: 5
  register: previous_release

- name: Refuse to deploy when the health response and configuration disagree
  ansible.builtin.assert:
    that:
      - previous_release.json.service == container_name
      - previous_release.json.status == 'ok'
      - previous_release.json.slot == active_slot or (active_slot == 'blue' and previous_release.json.slot == 'primary')
      - previous_release.json.release | length > 0
      - previous_release.json.version | length > 0
      - previous_release.json.revision | length > 0
    fail_msg: Check for an unfinished Nginx reload or deployment before proceeding.

- name: Report the traffic switch planned for this release
  ansible.builtin.debug:
    msg: "{{ active_slot }}:{{ slot_ports[active_slot] }} -> {{ target_slot }}:{{ slot_ports[target_slot] }}"

- name: Require a new release ID and a consistent previous release on all servers
  ansible.builtin.assert:
    that:
      - previous_release.json.release != release_id

- name: Verify the previous release on every backend before deployment
  ansible.builtin.uri:
    url: "http://{{ hostvars[item].ansible_host }}:{{ slot_ports[active_slot] }}/health"
    use_proxy: false
    timeout: 5
    return_content: true
  loop: "{{ groups['app_servers'] }}"
  register: previous_health
  failed_when: >-
    previous_health.status | default(0) != 200 or
    previous_health.json.status | default('') != 'ok' or
    previous_health.json.service | default('') != container_name or
    previous_health.json.release | default('') != previous_release.json.release or
    previous_health.json.version | default('') != previous_release.json.version or
    previous_health.json.revision | default('') != previous_release.json.revision or
    previous_health.json.instance | default('') != item or
    previous_health.json.slot | default('') != previous_release.json.slot
