---
- name: Require the complete deployment topology
  ansible.builtin.assert:
    that:
      - not ansible_check_mode
      - groups['load_balancers'] | length == 1
      - groups['app_servers'] | length == 3
    fail_msg: Deployment requires one load balancer, three app servers, and normal execution without --check.

- name: Read the existing configuration for discovery and rollback
  ansible.builtin.slurp:
    src: "{{ nginx_config_path }}"
  register: previous_nginx_config

- name: Determine slots from the three upstream addresses
  ansible.builtin.command:
    argv: "{{ ['python3', playbook_dir ~ '/../../scripts/deployment_state.py', '--upstream', nginx_upstream, '--hosts'] + (groups['app_servers'] | map('extract', hostvars, 'ansible_host') | list) }}"
    stdin: "{{ previous_nginx_config.content | b64decode }}"
  delegate_to: localhost
  become: false
  register: discovered_slots
  changed_when: false

- name: Remember the active and candidate slots for this deployment
  ansible.builtin.set_fact:
    active_slot: "{{ (discovered_slots.stdout | from_json).active_slot }}"
    target_slot: "{{ (discovered_slots.stdout | from_json).target_slot }}"

- name: Check the active service and capture its release
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nginx_port }}/health"
    use_proxy: false
    return_content: true
    timeout: 5
  register: previous_release

- name: Refuse to deploy when the health response and configuration disagree
  ansible.builtin.assert:
    that:
      - previous_release.json.service == container_name
      - previous_release.json.status == 'ok'
      - previous_release.json.slot == active_slot or (active_slot == 'blue' and previous_release.json.slot == 'primary')
      - previous_release.json.release | length > 0
      - previous_release.json.version | length > 0
      - previous_release.json.revision | length > 0
    fail_msg: Check for an unfinished Nginx reload or deployment before proceeding.

- name: Report the traffic switch planned for this release
  ansible.builtin.debug:
    msg: "{{ active_slot }}:{{ slot_ports[active_slot] }} -> {{ target_slot }}:{{ slot_ports[target_slot] }}"
