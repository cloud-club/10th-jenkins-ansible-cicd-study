---
- name: Deploy the same image to Dongwook's three app servers
  hosts: app_servers
  become: true
  become_user: root
  gather_facts: false
  serial: 1
  any_errors_fatal: true
  roles:
    - app

- name: Deploy Dongwook's Nginx configuration after the app servers
  hosts: load_balancers
  become: true
  become_user: root
  gather_facts: false
  any_errors_fatal: true
  roles:
    - nginx
