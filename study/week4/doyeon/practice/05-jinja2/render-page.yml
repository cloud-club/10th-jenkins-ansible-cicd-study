---
- name: Render a web page with Jinja2
  hosts: web
  become: true
  gather_facts: false

  vars:
    app_name: Ansible Template Lab
    maintenance_mode: false
    enabled_features:
      - inventory
      - playbook
      - jinja2
      - safe execution

  tasks:
    - name: Render status page
      ansible.builtin.template:
        src: templates/status.html.j2
        dest: /var/www/html/ansible-status.html
        owner: root
        group: root
        mode: "0644"
        backup: true

    - name: Verify rendered page
      ansible.builtin.uri:
        url: http://localhost/ansible-status.html
        status_code: 200
        return_content: true
      register: page_check
      changed_when: false
      failed_when: >
        page_check.status != 200 or
        'ANSIBLE TEMPLATE LAB' not in page_check.content
      when: not ansible_check_mode
